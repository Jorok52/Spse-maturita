      '<div class="fb" id="fb"></div>'+
      '<div class="kbdhint kb">1–4 odpověď · Enter další otázka</div></div>';
    document.getElementById('back').onclick = () => finish(true);
    view.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
    onKey = e => {
      if(!answered && /^[1-4]$/.test(e.key)){ e.preventDefault(); answer(+e.key-1); }
      else if(answered && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); next(); }
    };
  }
  function answer(k){
    if(answered) return; answered = true;
    const ok = k === cur.correct;
    if(cfg.record && cur.id) record(cur.id, ok);
    let gain = 0;
    if(ok){ combo++; bestCombo = Math.max(bestCombo, combo); score++; gain = 10 + Math.min(combo-1, 5)*2; xp += gain; beep('ok', {combo}); }
    else { combo = 0; if(hp != null) hp--; wrongs.push(cur); beep('bad'); }
    marks[i] = ok ? 'ok' : 'bad';
    i++;
    if(gain) addXP(gain); else renderStats();
    view.querySelectorAll('.opt').forEach((b,j) => { b.disabled = true; if(j === cur.correct) b.classList.add('ok'); else if(j === k) b.classList.add('bad'); });
    const qtop = view.querySelector('.qtop'); qtop.innerHTML = segs()+'<div class="row" style="gap:14px">'+fuses()+'<span class="combo">'+(combo>1?'×'+combo+' série':'')+'</span></div>';
    const fb = document.getElementById('fb');
    const last = (cfg.total && i >= cfg.total) || (cfg.lives != null && hp <= 0);
    fb.innerHTML = '<span class="msg '+(ok?'ok':'bad')+'">'+(ok?'Správně · +'+gain+' XP':'Špatně · správně je zvýrazněno')+'</span><button class="btn" id="nx">'+(last?'Výsledky':'Další')+'<span class="kbd">Enter</span></button>';
    document.getElementById('nx').onclick = next;
    document.getElementById('nx').focus({preventScroll:true});
    if(!ok) aiExplainButton(cur, fb);
  }
  function finish(aborted){
    onKey = null;
    if(cfg.onEnd) cfg.onEnd(score);
    const answeredN = marks.filter(Boolean).length;
    if(aborted && answeredN === 0){ cfg.back(); return; }
    view.innerHTML =
      '<div class="bench"><div class="eyebrow">'+esc(cfg.title)+'</div><h1 style="font-size:30px;margin-top:6px">'+
      (cfg.lives != null && hp <= 0 ? 'Pojistky spálené' : (score === answeredN && answeredN ? 'Čistý průchod' : 'Hotovo'))+'</h1>'+
      '<div class="result"><div class="tile"><div class="v">'+score+'/'+answeredN+'</div><div class="l">správně</div></div>'+
      '<div class="tile"><div class="v">+'+xp+'</div><div class="l">XP</div></div>'+
      '<div class="tile"><div class="v">×'+bestCombo+'</div><div class="l">nejdelší série</div></div></div>'+
      (cfg.extra ? cfg.extra(score) : '')+
      (wrongs.length ? '<div class="section"><h2>Na tohle se podívej</h2><div class="wronglist">'+wrongs.map(w => '<div><b>'+esc(w.text)+'</b><span>'+esc(w.ans)+'</span></div>').join('')+'</div></div>' : '')+
      '<div class="row" style="margin-top:22px"><button class="btn" id="again">Znovu<span class="kbd">Enter</span></button><button class="btn ghost" id="bk">Zpět</button></div></div>';
    document.getElementById('again').onclick = cfg.again;
    document.getElementById('bk').onclick = cfg.back;
    onKey = e => { if(e.key === 'Enter'){ e.preventDefault(); cfg.again(); } };
    if(cfg.after) cfg.after(score);
    window.scrollTo(0,0);
  }
  next();
}

/* ---------------- subnetting ---------------- */
function ip2s(x){ x = x>>>0; return [x>>>24,(x>>>16)&255,(x>>>8)&255,x&255].join('.'); }
function maskOf(p){ return p === 0 ? 0 : (0xFFFFFFFF << (32-p))>>>0; }
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function genSubnet(){
  const ps = [8,16,19,20,21,22,23,24,24,25,25,26,26,27,27,28,28,29,30];
  const p = ps[ri(0, ps.length-1)];
  const base = [ () => ((192<<24)|(168<<16)|(ri(0,255)<<8)|ri(1,254))>>>0,
                 () => ((10<<24)|(ri(0,255)<<16)|(ri(0,255)<<8)|ri(1,254))>>>0,
                 () => ((172<<24)|(ri(16,31)<<16)|(ri(0,255)<<8)|ri(1,254))>>>0 ][ri(0,2)]();
  const ip = base, mask = maskOf(p), net = (ip & mask)>>>0, size = Math.pow(2, 32-p), bc = (net + size - 1)>>>0;
  const types = ['net','bc','hosts','mask','wild','first','last'];
  const ty = types[ri(0, types.length-1)];
  const nb = (q) => { const m = maskOf(q); return [(ip & m)>>>0, ((ip & m)>>>0) + Math.pow(2,32-q) - 1]; };
  let text, ans, cands;
  const cidr = ip2s(ip)+'/'+p;
  const fmtN = v => v.toLocaleString('cs-CZ');
  switch(ty){
    case 'net': text = 'Jaká je adresa sítě pro '+cidr+'?'; ans = ip2s(net);
      cands = [ip2s(bc), ip2s(net+1), ip2s(nb(Math.min(p+1,31))[0] === net ? net + size/2 : nb(Math.min(p+1,31))[0]), ip2s(nb(Math.max(p-1,1))[0] === net ? (net - size)>>>0 : nb(Math.max(p-1,1))[0]), ip2s(net+size), ip2s(ip)]; break;
    case 'bc': text = 'Jaká je broadcast adresa pro '+cidr+'?'; ans = ip2s(bc);
      cands = [ip2s(net), ip2s(bc-1), ip2s(nb(Math.min(p+1,31))[1]), ip2s(nb(Math.max(p-1,1))[1]), ip2s(bc+size), ip2s((bc|255)>>>0)]; break;
    case 'hosts': text = 'Kolik použitelných adres hostů má síť s prefixem /'+p+'?'; ans = fmtN(size-2);
      cands = [fmtN(size), fmtN(size-1), fmtN(size/2-2), fmtN(size*2-2), fmtN(size+2)]; break;
    case 'mask': text = 'Jaká maska odpovídá prefixu /'+p+'?'; ans = ip2s(mask);
      cands = [ip2s(maskOf(p+1)), ip2s(maskOf(p-1)), ip2s(maskOf(p+2)), ip2s(maskOf(p-2)), ip2s(~mask)]; break;
    case 'wild': text = 'Jaká je wildcard maska pro prefix /'+p+'?'; ans = ip2s(~mask);
      cands = [ip2s(mask), ip2s(~maskOf(p+1)), ip2s(~maskOf(p-1)), ip2s(~maskOf(p+2))]; break;
    case 'first': text = 'Jaká je první použitelná adresa hosta pro '+cidr+'?'; ans = ip2s(net+1);
      cands = [ip2s(net), ip2s(net+2), ip2s(bc-1), ip2s(bc)]; break;
    default: text = 'Jaká je poslední použitelná adresa hosta pro '+cidr+'?'; ans = ip2s(bc-1);
      cands = [ip2s(bc), ip2s(bc-2), ip2s(net+1), ip2s(net)]; break;
  }
  const ws = []; shuffle(cands).forEach(c => { if(c !== ans && !ws.includes(c) && ws.length < 3) ws.push(c); });
  let guard = 0; while(ws.length < 3 && guard++ < 50){ const c = ty === 'hosts' ? fmtN(ri(1, 4000)) : ip2s((net + ri(1, 4096))>>>0); if(c !== ans && !ws.includes(c)) ws.push(c); }
  const opts = shuffle([ans, ...ws]);
  return {id:null, n:11, text, opts, correct:opts.indexOf(ans), ans};
}
function runSubnet(){
  runQuiz({title:'Subnetting', total:10, lives:null, record:false, next:() => genSubnet(),
    extra:() => '<p class="muted small">Postup: síť = IP AND maska · broadcast = IP OR wildcard · hosti = 2<sup>32−prefix</sup> − 2 · blok = 256 − poslední oktet masky.</p>',
    back:() => renderTopic(11), again:() => runSubnet()});
}

/* ---------------- matching ---------------- */
function runMatch(n){
  const pairs = shuffle(T[n].terms).slice(0, 6);
  const L = shuffle(pairs.map((p,i) => ({i, s:p[0]}))), R = shuffle(pairs.map((p,i) => ({i, s:p[1]})));
  let selL = null, selR = null, done = 0, mistakes = 0; const t0 = Date.now(); let timer;
  view.innerHTML = '<div class="bench"><button class="back" id="back">← Ukončit</button>'+
    '<div class="qtop"><span class="lbl">'+ref(n)+' · spoj pojem s významem</span><span class="lbl" id="clock">0,0 s · chyby 0</span></div>'+
    '<div class="match"><div class="col">'+L.map(x => '<button class="tile-b term" data-side="L" data-i="'+x.i+'">'+esc(x.s)+'</button>').join('')+'</div>'+
    '<div class="col">'+R.map(x => '<button class="tile-b" data-side="R" data-i="'+x.i+'">'+esc(x.s)+'</button>').join('')+'</div></div>'+
    '<div class="kbdhint">Klikni na pojem vlevo a pak na jeho význam vpravo (nebo naopak).</div></div>';
  const clock = document.getElementById('clock');
  timer = setInterval(() => { clock.textContent = ((Date.now()-t0)/1000).toFixed(1).replace('.',',')+' s · chyby '+mistakes; }, 100);
  document.getElementById('back').onclick = () => { clearInterval(timer); renderTopic(n); };
  view.querySelectorAll('.tile-b').forEach(b => b.onclick = () => {
    if(b.classList.contains('done')) return;
    const side = b.dataset.side;
    view.querySelectorAll('.tile-b[data-side="'+side+'"]').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    if(side === 'L') selL = b; else selR = b;
    if(selL && selR){
      const a = selL, c = selR; selL = selR = null;
      if(a.dataset.i === c.dataset.i){
        [a,c].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
        done++; beep('ok');
        if(done === pairs.length) finish();
      } else {
        mistakes++; beep('bad');
        [a,c].forEach(x => { x.classList.remove('sel'); x.classList.add('err'); });
        setTimeout(() => [a,c].forEach(x => x.classList.remove('err')), 450);
      }
    }
  });
  function finish(){
    clearInterval(timer);
    const secs = Math.round((Date.now()-t0)/100)/10;
    const xp = Math.max(6, 30 - mistakes*4);
    let rec = false;
    if(!S.match[n] || secs < S.match[n]){ S.match[n] = secs; rec = true; save(); }
    addXP(xp);
    setTimeout(() => {
      view.innerHTML = '<div class="bench"><div class="eyebrow">Spojovačka · '+ref(n)+'</div><h1 style="font-size:30px;margin-top:6px">'+(rec?'Nový rekord':'Spojeno')+'</h1>'+
        '<div class="result"><div class="tile"><div class="v">'+String(secs).replace('.',',')+' s</div><div class="l">čas</div></div><div class="tile"><div class="v">'+mistakes+'</div><div class="l">chyby</div></div><div class="tile"><div class="v">+'+xp+'</div><div class="l">XP</div></div></div>'+
        '<div class="row"><button class="btn" id="again">Znovu<span class="kbd">Enter</span></button><button class="btn ghost" id="bk">Zpět na téma</button></div></div>';
      document.getElementById('again').onclick = () => runMatch(n);
      document.getElementById('bk').onclick = () => renderTopic(n);
      onKey = e => { if(e.key === 'Enter'){ e.preventDefault(); runMatch(n); } };
    }, 350);
  }
}

    onKey = null; if(timer && timer.stop) timer.stop();
    if(!results.length){ if(aborted || timeout){ drawn ? go('') : renderTopic(n); if(timeout) toast('Čas vypršel dřív, než jsi vyhodnotil první podotázku'); } return; }
    const avg = results.reduce((s,x) => s+x.r, 0) / results.length;
    const grade = avg >= .85 ? 1 : avg >= .7 ? 2 : avg >= .5 ? 3 : avg >= .3 ? 4 : 5;
    view.innerHTML = '<div class="bench"><div class="eyebrow">Ústní zkouška · '+ref(n)+'</div><h1 style="font-size:30px;margin-top:6px">Odhad známky: '+grade+'</h1>'+(timeout ? '<p class="muted small">Čas vypršel po '+results.length+' z '+t.open.length+' podotázek. Nezodpovězené se nepočítají.</p>' : '')+
      '<div class="result"><div class="tile"><div class="v">'+pct(avg)+'</div><div class="l">pokrytí bodů</div></div><div class="tile"><div class="v">+'+xpTot+'</div><div class="l">XP</div></div><div class="tile"><div class="v">'+pct(topicMastery(n))+'</div><div class="l">zvládnutí tématu</div></div></div>'+
      '<div class="wronglist">'+results.map(x => '<div style="border-left-color:'+(x.r>=.75?'var(--ok)':x.r>=.4?'var(--warn)':'var(--bad)')+'"><b>'+esc(x.q)+'</b><span class="mono" style="color:var(--silk-dim)">'+pct(x.r)+'</span></div>').join('')+'</div>'+
      '<div class="row" style="margin-top:22px"><button class="btn" id="again">Zkoušet znovu</button><button class="btn ghost" id="draw">Losovat další</button><button class="btn ghost" id="bk">Na desku</button></div></div>';
    document.getElementById('again').onclick = () => runOral(n, drawn);
    document.getElementById('draw').onclick = () => runDraw();
    document.getElementById('bk').onclick = () => go('');
    window.scrollTo(0,0);
  }
  intro();
}

/* ---------------- draw (losování) ---------------- */
function runDraw(){
  const target = NUMS[Math.floor(Math.random()*NUMS.length)];
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  view.innerHTML = '<div class="bench"><button class="back" id="back">← Zpět</button><div class="eyebrow" style="text-align:center">Losování maturitní otázky</div><div class="drum" id="drum">--</div><div class="drawn" id="drawn"></div></div>';
  document.getElementById('back').onclick = () => go('');
  const drum = document.getElementById('drum');
  let k = 0; const steps = reduce ? 0 : 18;
  function spin(){
    if(k < steps){ drum.textContent = String(NUMS[Math.floor(Math.random()*NUMS.length)]); beep('tick'); k++; setTimeout(spin, 40 + k*k*1.1); }
    else { drum.textContent = String(target); beep('lvl'); show(); }
  }
  function show(){
    document.getElementById('drawn').innerHTML = '<h2>'+esc(T[target].t)+'</h2><p class="muted small mono" style="margin-top:6px">'+pct(topicMastery(target))+' zvládnuto</p>'+
      '<div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="oral">Ústní zkouška<span class="kbd">Enter</span></button><button class="btn ghost" id="aix">Zkoušení s AI</button><button class="btn ghost" id="quiz">Rychlý kvíz</button><button class="btn ghost" id="again">Losovat znovu</button></div>';
    document.getElementById('oral').onclick = () => runOral(target, true);
    document.getElementById('quiz').onclick = () => runTopicQuiz(target);
    document.getElementById('aix').onclick = () => runAIExam(target, {timed:lsGet('oral-timed', true), drawn:true});
    document.getElementById('again').onclick = () => runDraw();
    onKey = e => { if(e.key === 'Enter'){ e.preventDefault(); runOral(target, true); } };
  }
  spin();
}

/*LABS*/
/* ---- hlídání nové verze (GitHub Pages drží stránku v mezipaměti až 10 min) ----
   web: stáhne jen malý version.json (dřív to každých 5 minut stahovalo celou stránku) */
(function(){
  const mine = document.querySelector('meta[name="md-version"]')?.content || '';
  if(!MD_WEB || !/^https?:/.test(location.protocol) || !mine || /VERSION/.test(mine)) return;
  const check = () => { if(document.hidden || !navigator.onLine) return;
    fetch('version.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    const v = j && j.v; if(!v || v === mine || document.querySelector('.newver')) return;
    const d = document.createElement('div'); d.className = 'newver'; d.setAttribute('role', 'status');
    d.innerHTML = '<span>Je nová verze hry (' + esc(v) + ')</span><button class="btn" id="nvgo">Načíst</button>';
    document.body.appendChild(d);
    d.querySelector('#nvgo').onclick = () => { location.href = location.pathname + '?v=' + encodeURIComponent(v).replace(/%/g, '') + location.hash; };
  }).catch(() => {}); };
  setTimeout(check, 3000); setInterval(check, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
})();
/* ---- instalace na plochu a offline režim (jen web) ---- */
if(MD_WEB && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.PWA_PROMPT = e; if(window.MD_SET) MD_SET.refresh(); });
  addEventListener('appinstalled', () => { window.PWA_PROMPT = null; toast('Hotovo – Maturitní desku najdeš mezi aplikacemi.'); if(window.MD_SET) MD_SET.refresh(); });
}
window.__md = {LABS, T, QBY, renderTopic, runAIExam, get S(){ return S; }};
/* ---------------- boot ---------------- */
renderStats();
route();
})();
</script>
