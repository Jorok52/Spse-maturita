<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="IBM Plex Sans, Segoe UI, DejaVu Sans, Arial, sans-serif"><title>Typy pamětí podle závislosti na napájení</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f1c873"/></marker></defs><rect width="960" height="600" rx="18" fill="#0f1715"/><rect x="1" y="1" width="958" height="598" rx="17" fill="none" stroke="#d0a24b" stroke-opacity=".45"/><text x="36.0" y="48.0" font-size="26" fill="#efebdd" font-weight="700" text-anchor="start">Typy pamětí podle závislosti na napájení</text><text x="36.0" y="74.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="start">Volatilní (RWM) a nevolatilní (ROM) paměti a jejich použití v PC</text><rect x="390.0" y="96.0" width="180.0" height="44.0" rx="9" fill="#1d2926" stroke="#d0a24b" stroke-width="2"/><text x="480.0" y="124.0" font-size="18" fill="#f1c873" font-weight="700" text-anchor="middle">Paměti PC</text><path d="M480 140 V160 H230 V180 M480 160 H742 V180" stroke="#d0a24b" stroke-width="1.8" fill="none"/><rect x="70.0" y="180.0" width="320.0" height="64.0" rx="9" fill="#17211e" stroke="#7fd3ff" stroke-width="2"/><text x="84.0" y="205.0" font-size="16.5" fill="#7fd3ff" font-weight="700" text-anchor="start">Volatilní (RWM)</text><text x="84.0" y="227.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">po odpojení napájení ztrácí data</text><rect x="560.0" y="180.0" width="364.0" height="64.0" rx="9" fill="#17211e" stroke="#ffb340" stroke-width="2"/><text x="574.0" y="205.0" font-size="16.5" fill="#ffb340" font-weight="700" text-anchor="start">Nevolatilní (ROM)</text><text x="574.0" y="227.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">data zůstanou i bez napájení</text><path d="M230 244 V262" stroke="#7fd3ff" stroke-width="1.8" fill="none"/><rect x="70.0" y="262.0" width="320.0" height="44.0" rx="9" fill="#17211e" stroke="#7fd3ff" stroke-width="2"/><text x="84.0" y="287.0" font-size="16.5" fill="#7fd3ff" font-weight="700" text-anchor="start">RAM</text><text x="170.0" y="289.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="start">náhodný přístup, čtení i zápis</text><path d="M120 306 V326 M340 306 V326" stroke="#7fd3ff" stroke-width="1.6" fill="none"/><path d="M120 316 H340" stroke="#7fd3ff" stroke-width="1.6" fill="none"/><rect x="36.0" y="326.0" width="196.0" height="120.0" rx="9" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="50.0" y="351.0" font-size="16.5" fill="#61e38c" font-weight="700" text-anchor="start">SRAM</text><text x="50.0" y="373.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">klopné obvody (flip-flop)</text><text x="50.0" y="392.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="start">bez refreshe, rychlá</text><text x="50.0" y="411.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="start">drahá, malá kapacita</text><text x="50.0" y="430.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="start">→ cache L1, L2, L3</text><rect x="242.0" y="326.0" width="196.0" height="120.0" rx="9" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="256.0" y="351.0" font-size="16.5" fill="#61e38c" font-weight="700" text-anchor="start">DRAM</text><text x="256.0" y="373.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">tranzistor + kondenzátor</text><text x="256.0" y="392.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="start">nutný refresh</text><text x="256.0" y="411.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="start">levnější, větší kapacita</text><text x="256.0" y="430.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="start">→ operační paměť</text><path d="M340 446 V466" stroke="#61e38c" stroke-width="1.6" fill="none"/><rect x="242.0" y="466.0" width="196.0" height="64.0" rx="9" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="256.0" y="491.0" font-size="16.5" fill="#61e38c" font-weight="700" text-anchor="start">SDRAM, DDR–DDR5</text><text x="256.0" y="513.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">DDR: data na obou hranách</text><rect x="36.0" y="466.0" width="196.0" height="64.0" rx="9" fill="#17211e" stroke="#c39bff" stroke-width="2"/><text x="50.0" y="491.0" font-size="16.5" fill="#c39bff" font-weight="700" text-anchor="start">NRAM</text><text x="50.0" y="513.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">FIFO / LIFO buffery</text><path d="M742 244 V262" stroke="#ffb340" stroke-width="1.8" fill="none"/><rect x="560.0" y="262.0" width="364.0" height="48.0" rx="8" fill="#17211e" stroke="#ffb340" stroke-width="1.6"/><text x="574.0" y="292.0" font-size="15" fill="#ffb340" font-weight="700" text-anchor="start">Mask ROM</text><text x="680.0" y="292.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">z výroby pomocí masky</text><rect x="560.0" y="318.0" width="364.0" height="48.0" rx="8" fill="#17211e" stroke="#ffb340" stroke-width="1.6"/><text x="574.0" y="348.0" font-size="15" fill="#ffb340" font-weight="700" text-anchor="start">PROM</text><text x="680.0" y="348.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">jednorázově programátorem (OTP)</text><rect x="560.0" y="374.0" width="364.0" height="48.0" rx="8" fill="#17211e" stroke="#ffb340" stroke-width="1.6"/><text x="574.0" y="404.0" font-size="15" fill="#ffb340" font-weight="700" text-anchor="start">EPROM</text><text x="680.0" y="404.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">mazání UV zářením (celý obsah)</text><rect x="560.0" y="430.0" width="364.0" height="48.0" rx="8" fill="#17211e" stroke="#ffb340" stroke-width="1.6"/><text x="574.0" y="460.0" font-size="15" fill="#ffb340" font-weight="700" text-anchor="start">EEPROM</text><text x="680.0" y="460.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">mazání i přepis elektricky</text><rect x="560.0" y="486.0" width="364.0" height="48.0" rx="8" fill="#17211e" stroke="#ffb340" stroke-width="1.6"/><text x="574.0" y="516.0" font-size="15" fill="#ffb340" font-weight="700" text-anchor="start">Flash</text><text x="680.0" y="516.0" font-size="13.5" fill="#efebdd" font-weight="400" text-anchor="start">druh EEPROM → SSD, USB, BIOS</text><text x="36.0" y="572.0" font-size="14.5" fill="#a7b9ae" font-weight="400" text-anchor="start">Volatilní: RAM, cache. Nevolatilní: ROM, EEPROM, Flash, SSD. BIOS je uložený v ROM (dnes Flash).</text></svg>