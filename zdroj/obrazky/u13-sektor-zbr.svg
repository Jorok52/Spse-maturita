h="16.0" height="16.0" rx="3" fill="#c39bff55" stroke="#c39bff" stroke-width="1.5"/><text x="406.0" y="391.0" font-size="14.5" fill="#c39bff" font-weight="600" text-anchor="start">vnitřní zóna: 8 sektorů</text><text x="380.0" y="430.0" font-size="14.5" fill="#a7b9ae" font-weight="400" text-anchor="start">Na delších vnějších stopách je víc sektorů,</text><text x="380.0" y="450.0" font-size="14.5" fill="#a7b9ae" font-weight="400" text-anchor="start">velikost sektoru je všude stejná (např. 512 B).</text><rect x="380.0" y="478.0" width="544.0" height="108.0" rx="10" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="398.0" y="504.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start">Přístupová doba ≈ 8–15 ms (průměr HDD)</text><text x="398.0" y="530.0" font-size="14" fill="#efebdd" font-weight="400" text-anchor="start">vystavovací doba (seek) – hlavička přejede nad stopu</text><text x="398.0" y="551.0" font-size="14" fill="#efebdd" font-weight="400" text-anchor="start">+ rotační latence – sektor dojede pod hlavičku (dle RPM)</text><text x="398.0" y="572.0" font-size="14" fill="#a7b9ae" font-weight="400" text-anchor="start">+ přepnutí hlavičky – řádově nanosekundy</text><text x="36.0" y="584.0" font-size="12.5" fill="#a7b9ae" font-weight="400" text-anchor="start" opacity=".8">Údaje o počtu sektorů v zónách jsou jen ilustrační.</text></svg>