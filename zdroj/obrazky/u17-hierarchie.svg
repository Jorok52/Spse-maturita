<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="IBM Plex Sans, Segoe UI, DejaVu Sans, Arial, sans-serif"><title>Hierarchie pamětí a cache</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f1c873"/></marker></defs><rect width="960" height="600" rx="18" fill="#0f1715"/><rect x="1" y="1" width="958" height="598" rx="17" fill="none" stroke="#d0a24b" stroke-opacity=".45"/><text x="36.0" y="48.0" font-size="26" fill="#efebdd" font-weight="700" text-anchor="start">Hierarchie pamětí a cache</text><text x="36.0" y="74.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="start">Čím blíž procesoru, tím rychlejší a menší paměť</text><path d="M295.0 104 H365.0 L402.0 164 H258.0 Z" stroke="#f1c873" stroke-width="1.8" fill="#17211e"/><text x="330.0" y="132.0" font-size="14" fill="#f1c873" font-weight="700" text-anchor="middle">Registry CPU</text><text x="330.0" y="152.0" font-size="12.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">nejrychlejší</text><path d="M258.0 170 H402.0 L439.0 230 H221.0 Z" stroke="#7fd3ff" stroke-width="1.8" fill="#17211e"/><text x="330.0" y="198.0" font-size="16" fill="#7fd3ff" font-weight="700" text-anchor="middle">L1 cache</text><text x="330.0" y="218.0" font-size="12.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">desítky kB · L1i + L1d</text><path d="M221.0 236 H439.0 L476.0 296 H184.0 Z" stroke="#7fd3ff" stroke-width="1.8" fill="#17211e"/><text x="330.0" y="264.0" font-size="16" fill="#7fd3ff" font-weight="700" text-anchor="middle">L2 cache</text><text x="330.0" y="284.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">stovky kB až jednotky MB</text><path d="M184.0 302 H476.0 L513.0 362 H147.0 Z" stroke="#7fd3ff" stroke-width="1.8" fill="#17211e"/><text x="330.0" y="330.0" font-size="16" fill="#7fd3ff" font-weight="700" text-anchor="middle">L3 cache</text><text x="330.0" y="350.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">až desítky MB</text><path d="M147.0 368 H513.0 L550.0 428 H110.0 Z" stroke="#61e38c" stroke-width="1.8" fill="#17211e"/><text x="330.0" y="396.0" font-size="16" fill="#61e38c" font-weight="700" text-anchor="middle">RAM (DDR4)</text><text x="330.0" y="416.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">8–32 GB · cca 10–15 ns</text><path d="M110.0 434 H550.0 L587.0 494 H73.0 Z" stroke="#ffb340" stroke-width="1.8" fill="#17211e"/><text x="330.0" y="462.0" font-size="16" fill="#ffb340" font-weight="700" text-anchor="middle">Disk (HDD / SSD)</text><text x="330.0" y="482.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">největší · HDD až 10 ms</text><path d="M48 474 V114" stroke="#f1c873" stroke-width="2" fill="none" marker-end="url(#ar)"/><text transform="rotate(-90 32 304)" x="32.0" y="304.0" font-size="14" fill="#f1c873" font-weight="600" text-anchor="middle">rychlejší, dražší, menší</text><path d="M612 114 V474" stroke="#61e38c" stroke-width="2" fill="none" marker-end="url(#ar)"/><text transform="rotate(90 630 304)" x="630.0" y="304.0" font-size="14" fill="#61e38c" font-weight="600" text-anchor="middle">větší kapacita, levnější</text><text x="652.0" y="108.0" font-size="18" fill="#d0a24b" font-weight="700" text-anchor="start">Princip cache</text><rect x="652.0" y="120.0" width="100.0" height="50.0" rx="8" fill="#17211e" stroke="#f1c873" stroke-width="2"/><text x="702.0" y="151.0" font-size="17" fill="#f1c873" font-weight="700" text-anchor="middle">CPU</text><rect x="820.0" y="120.0" width="100.0" height="50.0" rx="8" fill="#17211e" stroke="#7fd3ff" stroke-width="2"/><text x="870.0" y="151.0" font-size="17" fill="#7fd3ff" font-weight="700" text-anchor="middle">cache</text><line x1="752.0" y1="145.0" x2="816.0" y2="145.0" stroke="#f1c873" stroke-width="2" marker-end="url(#ar)"/><rect x="820.0" y="290.0" width="100.0" height="50.0" rx="8" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="870.0" y="321.0" font-size="17" fill="#61e38c" font-weight="700" text-anchor="middle">RAM</text><line x1="870.0" y1="174.0" x2="870.0" y2="286.0" stroke="#ff7a6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="880.0" y="232.0" font-size="14" fill="#ff7a6b" font-weight="700" text-anchor="start">miss</text><path d="M820 316 C762 316 744 220 816 160" stroke="#61e38c" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="652.0" y="372.0" font-size="14.5" fill="#7fd3ff" font-weight="600" text-anchor="start">cache hit: data už jsou v cache</text><text x="652.0" y="392.0" font-size="14" fill="#a7b9ae" font-weight="400" text-anchor="start">→ načtou se rychle</text><text x="652.0" y="422.0" font-size="14.5" fill="#ff7a6b" font-weight="600" text-anchor="start">cache miss: data se načtou z RAM</text><text x="652.0" y="442.0" font-size="14" fill="#a7b9ae" font-weight="400" text-anchor="start">a cache se aktualizuje</text><text x="652.0" y="480.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">Cache (SRAM) vyrovnává rozdíl</text><text x="652.0" y="500.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">rychlosti mezi CPU a RAM.</text></svg>