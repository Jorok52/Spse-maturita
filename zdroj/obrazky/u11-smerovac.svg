<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="IBM Plex Sans, Segoe UI, DejaVu Sans, Arial, sans-serif"><title>Směrovač a směrovací tabulka</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f1c873"/></marker></defs><rect width="960" height="640" rx="18" fill="#0f1715"/><rect x="1" y="1" width="958" height="638" rx="17" fill="none" stroke="#d0a24b" stroke-opacity=".45"/><text x="36.0" y="48.0" font-size="26" fill="#efebdd" font-weight="700" text-anchor="start">Směrovač a směrovací tabulka</text><text x="36.0" y="74.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="start">Směrovač má rozhraní v různých sítích a podle tabulky předává pakety dál</text><rect x="36.0" y="112.0" width="210.0" height="150.0" rx="10" fill="#17211e" stroke="#7fd3ff" stroke-width="2"/><text x="141.0" y="140.0" font-size="15" fill="#7fd3ff" font-weight="700" text-anchor="middle">LAN 192.168.1.0/24</text><rect x="66.0" y="160.0" width="70.0" height="46.0" rx="5" fill="#1d2926" stroke="#2c3a35" stroke-width="1"/><rect x="92.0" y="206.0" width="18.0" height="8.0" rx="2" fill="#2c3a35"/><text x="101.0" y="189.0" font-size="14" fill="#efebdd" font-weight="600" text-anchor="middle">PC</text><rect x="166.0" y="160.0" width="70.0" height="46.0" rx="5" fill="#1d2926" stroke="#2c3a35" stroke-width="1"/><rect x="192.0" y="206.0" width="18.0" height="8.0" rx="2" fill="#2c3a35"/><text x="201.0" y="189.0" font-size="14" fill="#efebdd" font-weight="600" text-anchor="middle">PC</text><text x="141.0" y="240.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">brána: 192.168.1.1</text><rect x="380.0" y="140.0" width="190.0" height="96.0" rx="12" fill="#1f2a26" stroke="#d0a24b" stroke-width="2.5"/><text x="475.0" y="180.0" font-size="24" fill="#f1c873" font-weight="700" text-anchor="middle">R1</text><text x="475.0" y="206.0" font-size="14" fill="#a7b9ae" font-weight="400" text-anchor="middle">směrovač</text><line x1="246.0" y1="186.0" x2="380.0" y2="186.0" stroke="#7fd3ff" stroke-width="3"/><text x="372.0" y="176.0" font-size="13" fill="#7fd3ff" font-weight="600" text-anchor="end" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">G0/0</text><text x="372.0" y="206.0" font-size="12.5" fill="#a7b9ae" font-weight="400" text-anchor="end" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">192.168.1.1</text><line x1="570.0" y1="186.0" x2="720.0" y2="186.0" stroke="#ffb340" stroke-width="3" stroke-dasharray="10 6"/><text x="578.0" y="176.0" font-size="13" fill="#ffb340" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">S0/0/0</text><text x="645.0" y="210.0" font-size="13" fill="#ffb340" font-weight="600" text-anchor="middle">WAN</text><rect x="720.0" y="150.0" width="90.0" height="72.0" rx="10" fill="#1f2a26" stroke="#2c3a35" stroke-width="2"/><text x="765.0" y="193.0" font-size="18" fill="#efebdd" font-weight="700" text-anchor="middle">R2</text><line x1="810.0" y1="186.0" x2="850.0" y2="186.0" stroke="#61e38c" stroke-width="3"/><rect x="850.0" y="112.0" width="76.0" height="150.0" rx="10" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="888.0" y="172.0" font-size="13" fill="#61e38c" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">172.16.</text><text x="888.0" y="190.0" font-size="13" fill="#61e38c" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">3.0/24</text><text x="36.0" y="304.0" font-size="18" fill="#d0a24b" font-weight="700" text-anchor="start">Směrovací tabulka R1</text><rect x="36.0" y="318.0" width="888.0" height="38.0" rx="6" fill="#1d2926" stroke="#2c3a35" stroke-width="1"/><text x="52.0" y="343.0" font-size="14.5" fill="#d0a24b" font-weight="700" text-anchor="start">Cílová síť</text><text x="336.0" y="343.0" font-size="14.5" fill="#d0a24b" font-weight="700" text-anchor="start">Výstupní rozhraní</text><text x="576.0" y="343.0" font-size="14.5" fill="#d0a24b" font-weight="700" text-anchor="start">Metrika</text><text x="686.0" y="343.0" font-size="14.5" fill="#d0a24b" font-weight="700" text-anchor="start">Jak se tam dostala</text><rect x="36.0" y="364.0" width="888.0" height="38.0" rx="6" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="52.0" y="389.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">192.168.1.0 /24</text><text x="336.0" y="389.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">G0/0</text><text x="576.0" y="389.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">0</text><text x="686.0" y="389.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">přímo připojená</text><rect x="36.0" y="408.0" width="888.0" height="38.0" rx="6" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="52.0" y="433.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">172.16.3.0 /24</text><text x="336.0" y="433.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">S0/0/0</text><text x="576.0" y="433.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">1</text><text x="686.0" y="433.0" font-size="15" fill="#efebdd" font-weight="500" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">statická: ip route …</text><text x="36.0" y="476.0" font-size="16" fill="#f1c873" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">ip route 172.16.3.0 255.255.255.0 s0/0/0</text><text x="36.0" y="498.0" font-size="14.5" fill="#a7b9ae" font-weight="400" text-anchor="start">→ statická trasa přes výstupní rozhraní s0/0/0</text><text x="520.0" y="476.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">1. přečte cílovou IP adresu paketu</text><text x="520.0" y="502.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">2. zjistí, jestli není jeho vlastní</text><text x="520.0" y="528.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">3. nahlédne do směrovací tabulky</text><text x="520.0" y="554.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">4. odešle paket rozhraním k cílové síti</text><text x="36.0" y="600.0" font-size="14" fill="#a7b9ae" font-weight="400" text-anchor="start">Metrika = „vzdálenost“ k cílové síti – nižší = lepší cesta. Výchozí bráně posílá PC pakety pro cíle mimo svou podsíť.</text></svg>