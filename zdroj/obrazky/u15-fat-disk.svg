<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="IBM Plex Sans, Segoe UI, DejaVu Sans, Arial, sans-serif"><title>Logický disk se systémem FAT (FAT12 / FAT16)</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f1c873"/></marker></defs><rect width="960" height="430" rx="18" fill="#0f1715"/><rect x="1" y="1" width="958" height="428" rx="17" fill="none" stroke="#d0a24b" stroke-opacity=".45"/><text x="36.0" y="48.0" font-size="26" fill="#efebdd" font-weight="700" text-anchor="start">Logický disk se systémem FAT (FAT12 / FAT16)</text><text x="36.0" y="74.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="start">Organizační oblast a datová oblast – tak ji vytvoří logické formátování</text><rect x="36.0" y="120.0" width="128.0" height="104.0" rx="8" fill="#17211e" stroke="#d0a24b" stroke-width="2"/><text x="100.0" y="164.0" font-size="16" fill="#d0a24b" font-weight="700" text-anchor="middle">Boot Record</text><text x="100.0" y="190.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">zaváděcí záznam</text><rect x="170.0" y="120.0" width="122.0" height="104.0" rx="8" fill="#17211e" stroke="#7fd3ff" stroke-width="2"/><text x="231.0" y="164.0" font-size="16" fill="#7fd3ff" font-weight="700" text-anchor="middle">FAT 1</text><text x="231.0" y="190.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">alokační tabulka</text><rect x="298.0" y="120.0" width="122.0" height="104.0" rx="8" fill="#17211e" stroke="#7fd3ff" stroke-width="2"/><text x="359.0" y="164.0" font-size="16" fill="#7fd3ff" font-weight="700" text-anchor="middle">FAT 2</text><text x="359.0" y="190.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">záloha FAT 1</text><rect x="426.0" y="120.0" width="146.0" height="104.0" rx="8" fill="#17211e" stroke="#c39bff" stroke-width="2"/><text x="499.0" y="164.0" font-size="16" fill="#c39bff" font-weight="700" text-anchor="middle">Root Directory</text><text x="499.0" y="190.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">hlavní adresář</text><rect x="578.0" y="120.0" width="346.0" height="104.0" rx="8" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="751.0" y="148.0" font-size="18" fill="#61e38c" font-weight="700" text-anchor="middle">Datová oblast</text><rect x="590.0" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="608.4" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">2</text><rect x="630.8" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="649.1" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">3</text><rect x="671.5" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="689.9" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">4</text><rect x="712.2" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="730.6" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">5</text><rect x="753.0" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="771.4" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">6</text><rect x="793.8" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="812.1" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">7</text><rect x="834.5" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="852.9" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">8</text><rect x="875.2" y="164.0" width="36.8" height="46.0" rx="5" fill="#123326" stroke="#61e38c" stroke-width="1"/><text x="893.6" y="194.0" font-size="16" fill="#efebdd" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">…</text><path d="M36 234 v8 H296.0 l8 8 l8 -8 H572 v-8" stroke="#f1c873" stroke-width="1.5" fill="none"/><text x="304.0" y="268.0" font-size="15" fill="#f1c873" font-weight="600" text-anchor="middle">Organizační oblast (system area)</text><path d="M578 234 v8 H743.0 l8 8 l8 -8 H924 v-8" stroke="#61e38c" stroke-width="1.5" fill="none"/><text x="751.0" y="268.0" font-size="15" fill="#61e38c" font-weight="600" text-anchor="middle">Datová oblast – clustery</text><circle cx="42" cy="295" r="3.5" fill="#d0a24b"/><text x="54.0" y="300.0" font-size="15.5" fill="#efebdd" font-weight="400" text-anchor="start">Boot Record: typ souborového systému, rozložení disku, počet sektorů v clusteru.</text><circle cx="42" cy="325" r="3.5" fill="#d0a24b"/><text x="54.0" y="330.0" font-size="15.5" fill="#efebdd" font-weight="400" text-anchor="start">FAT 1 a FAT 2: které clustery jsou volné, obsazené, vadné a jak na sebe navazují; FAT 2 je záloha.</text><circle cx="42" cy="355" r="3.5" fill="#d0a24b"/><text x="54.0" y="360.0" font-size="15.5" fill="#efebdd" font-weight="400" text-anchor="start">Root Directory (FAT12/16): hned za FAT 2, pevná velikost. U FAT32 je přesunutý do datové oblasti.</text><circle cx="42" cy="385" r="3.5" fill="#d0a24b"/><text x="54.0" y="390.0" font-size="15.5" fill="#efebdd" font-weight="400" text-anchor="start">Clustery se číslují od 2 – čísla 0 a 1 jsou rezervovaná. Strukturu vytvoří logické formátování (format).</text></svg>