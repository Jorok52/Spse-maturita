<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="IBM Plex Sans, Segoe UI, DejaVu Sans, Arial, sans-serif"><title>Geometrie pevného disku</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f1c873"/></marker></defs><rect width="960" height="600" rx="18" fill="#0f1715"/><rect x="1" y="1" width="958" height="598" rx="17" fill="none" stroke="#d0a24b" stroke-opacity=".45"/><text x="36.0" y="48.0" font-size="26" fill="#efebdd" font-weight="700" text-anchor="start">Geometrie pevného disku</text><text x="36.0" y="74.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="start">Stopa, sektor a cylindr – podle nich se adresuje CHS</text><circle cx="220" cy="322" r="182" fill="#1a2421" stroke="#2c3a35" stroke-width="2"/><circle cx="220" cy="322" r="172" fill="none" stroke="#7fd3ff" stroke-width="2.5"/><circle cx="220" cy="322" r="152" fill="none" stroke="#2c3a35" stroke-width="1.2"/><circle cx="220" cy="322" r="132" fill="none" stroke="#2c3a35" stroke-width="1.2"/><circle cx="220" cy="322" r="112" fill="none" stroke="#2c3a35" stroke-width="1.2"/><circle cx="220" cy="322" r="92" fill="none" stroke="#2c3a35" stroke-width="1.2"/><circle cx="220" cy="322" r="72" fill="none" stroke="#2c3a35" stroke-width="1.2"/><path d="M286.7 196.6 A142 142 0 0 1 331.9 234.6 L316.1 246.9 A122 122 0 0 0 277.3 214.3 Z" stroke="#f1c873" stroke-width="2" fill="rgba(241,200,115,.45)"/><circle cx="220" cy="322" r="30" fill="#2a3532" stroke="#a7b9ae"/><circle cx="220" cy="322" r="7" fill="#a7b9ae"/><path d="M446 438 L360 286" stroke="#d0a24b" stroke-width="6" fill="none"/><circle cx="446" cy="438" r="14" fill="#2a3532" stroke="#d0a24b"/><rect x="348.0" y="272.0" width="22.0" height="16.0" rx="3" fill="#f1c873"/><text x="220.0" y="124.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="middle">pohled shora na plotnu</text><path d="M370 226 L434 172" stroke="#7fd3ff" stroke-width="1.2" fill="none"/><text x="440.0" y="170.0" font-size="14.5" fill="#7fd3ff" font-weight="600" text-anchor="start">stopa 0 (u obvodu)</text><path d="M335.9 234.6 L434 222" stroke="#f1c873" stroke-width="1.2" fill="none"/><text x="440.0" y="226.0" font-size="14.5" fill="#f1c873" font-weight="600" text-anchor="start">sektor = výseč</text><text x="440.0" y="245.0" font-size="14.5" fill="#f1c873" font-weight="600" text-anchor="start">stopy</text><text x="472.0" y="444.0" font-size="14.5" fill="#d0a24b" font-weight="600" text-anchor="start">hlavička</text><text x="472.0" y="463.0" font-size="14.5" fill="#d0a24b" font-weight="600" text-anchor="start">na rameni</text><ellipse cx="768" cy="200" rx="150" ry="26" fill="#1a2421" stroke="#2c3a35" stroke-width="1.6"/><ellipse cx="768" cy="200" rx="96" ry="16" fill="none" stroke="#c39bff" stroke-width="2.4"/><rect x="854.0" y="181.0" width="20.0" height="10.0" rx="2" fill="#f1c873"/><text x="890.0" y="191.0" font-size="13" fill="#f1c873" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">H0</text><rect x="854.0" y="209.0" width="20.0" height="10.0" rx="2" fill="#f1c873"/><text x="890.0" y="219.0" font-size="13" fill="#f1c873" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">H1</text><ellipse cx="768" cy="300" rx="150" ry="26" fill="#1a2421" stroke="#2c3a35" stroke-width="1.6"/><ellipse cx="768" cy="300" rx="96" ry="16" fill="none" stroke="#c39bff" stroke-width="2.4"/><rect x="854.0" y="281.0" width="20.0" height="10.0" rx="2" fill="#f1c873"/><text x="890.0" y="291.0" font-size="13" fill="#f1c873" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">H2</text><rect x="854.0" y="309.0" width="20.0" height="10.0" rx="2" fill="#f1c873"/><text x="890.0" y="319.0" font-size="13" fill="#f1c873" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">H3</text><ellipse cx="768" cy="400" rx="150" ry="26" fill="#1a2421" stroke="#2c3a35" stroke-width="1.6"/><ellipse cx="768" cy="400" rx="96" ry="16" fill="none" stroke="#c39bff" stroke-width="2.4"/><rect x="854.0" y="381.0" width="20.0" height="10.0" rx="2" fill="#f1c873"/><text x="890.0" y="391.0" font-size="13" fill="#f1c873" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">H4</text><rect x="854.0" y="409.0" width="20.0" height="10.0" rx="2" fill="#f1c873"/><text x="890.0" y="419.0" font-size="13" fill="#f1c873" font-weight="600" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">H5</text><line x1="768.0" y1="160.0" x2="768.0" y2="420.0" stroke="#a7b9ae" stroke-width="4"/><path d="M672 200 V400 M864 200 V400" stroke="#c39bff" stroke-width="1.5" fill="none" stroke-dasharray="6 5"/><text x="768.0" y="138.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="middle">pohled z boku: 3 plotny, 6 hlaviček</text><text x="768.0" y="460.0" font-size="15" fill="#c39bff" font-weight="700" text-anchor="middle">cylindr = stopy se stejným průměrem</text><text x="768.0" y="482.0" font-size="15" fill="#c39bff" font-weight="700" text-anchor="middle">na všech plotnách nad sebou</text><text x="36.0" y="548.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">Stopa = soustředná kružnice, čísluje se od obvodu (0) ke středu. Sektor = nejmenší adresovatelná jednotka, čísluje se od 1.</text><text x="36.0" y="572.0" font-size="14.5" fill="#a7b9ae" font-weight="400" text-anchor="start">CHS: C = cylindr, H = hlava, S = sektor.  LBA: lineární číslo bloku od 0 – CHS 0-0-1 = LBA 0.</text></svg>