<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="IBM Plex Sans, Segoe UI, DejaVu Sans, Arial, sans-serif"><title>Vnitřní struktura svazku NTFS</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f1c873"/></marker></defs><rect width="960" height="700" rx="18" fill="#0f1715"/><rect x="1" y="1" width="958" height="698" rx="17" fill="none" stroke="#d0a24b" stroke-opacity=".45"/><text x="36.0" y="48.0" font-size="26" fill="#efebdd" font-weight="700" text-anchor="start">Vnitřní struktura svazku NTFS</text><text x="36.0" y="74.0" font-size="15" fill="#a7b9ae" font-weight="400" text-anchor="start">NTFS je databázová struktura: MFT + metasoubory</text><rect x="36.0" y="112.0" width="78.0" height="92.0" rx="8" fill="#17211e" stroke="#d0a24b" stroke-width="2"/><text x="75.0" y="152.0" font-size="16.5" fill="#d0a24b" font-weight="700" text-anchor="middle">Boot</text><text x="75.0" y="176.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">$BOOT</text><rect x="120.0" y="112.0" width="144.0" height="92.0" rx="8" fill="#17211e" stroke="#7fd3ff" stroke-width="2"/><text x="192.0" y="152.0" font-size="16.5" fill="#7fd3ff" font-weight="700" text-anchor="middle">MFT</text><text x="192.0" y="176.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">tabulka souborů</text><rect x="270.0" y="112.0" width="144.0" height="92.0" rx="8" fill="#0f1715" stroke="#7fd3ff" stroke-width="2" stroke-dasharray="6 4"/><text x="342.0" y="152.0" font-size="16.5" fill="#7fd3ff" font-weight="700" text-anchor="middle">rezerva MFT</text><text x="342.0" y="176.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">≈ 12 % disku</text><rect x="420.0" y="112.0" width="184.0" height="92.0" rx="8" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="512.0" y="160.0" font-size="16.5" fill="#61e38c" font-weight="700" text-anchor="middle">uživatelská data</text><rect x="610.0" y="112.0" width="104.0" height="92.0" rx="8" fill="#17211e" stroke="#c39bff" stroke-width="2"/><text x="662.0" y="152.0" font-size="16.5" fill="#c39bff" font-weight="700" text-anchor="middle">$MFTMirr</text><text x="662.0" y="176.0" font-size="13.5" fill="#a7b9ae" font-weight="400" text-anchor="middle">střed disku</text><rect x="720.0" y="112.0" width="198.0" height="92.0" rx="8" fill="#17211e" stroke="#61e38c" stroke-width="2"/><text x="819.0" y="160.0" font-size="16.5" fill="#61e38c" font-weight="700" text-anchor="middle">uživatelská data</text><text x="36.0" y="236.0" font-size="15" fill="#efebdd" font-weight="400" text-anchor="start">MFT leží ihned za boot sektorem. Boot sektor ($BOOT) obsahuje přesné umístění MFT i její kopie $MFTMirr.</text><text x="36.0" y="260.0" font-size="15" fill="#efebdd" font-weight="400" text-anchor="start">Rezerva cca 12 % zůstává volná, aby MFT mohla růst bez fragmentace. Kopie prvních 16 záznamů je uprostřed disku.</text><text x="36.0" y="304.0" font-size="18" fill="#7fd3ff" font-weight="700" text-anchor="start">MFT – Master File Table: každý soubor i složka = 1 záznam pevné délky</text><text x="36.0" y="328.0" font-size="14.5" fill="#a7b9ae" font-weight="400" text-anchor="start">Prvních 16 záznamů = metasoubory: skryté systémové soubory, začínají $. Záznam 0 popisuje samotnou MFT.</text><rect x="36.0" y="352.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="50.0" y="380.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$MFT</text><text x="164.0" y="380.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">hlavní databáze souborů</text><rect x="486.0" y="352.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="500.0" y="380.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$MFTMirr</text><text x="614.0" y="380.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">kopie prvních 16 záznamů</text><rect x="36.0" y="404.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="50.0" y="432.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$LogFile</text><text x="164.0" y="432.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">transakční log, obnova po havárii</text><rect x="486.0" y="404.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="500.0" y="432.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$Volume</text><text x="614.0" y="432.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">sériové číslo a čas vytvoření</text><rect x="36.0" y="456.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="50.0" y="484.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$AttrDef</text><text x="164.0" y="484.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">definice atributů</text><rect x="486.0" y="456.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="500.0" y="484.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$Bitmap</text><text x="614.0" y="484.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">obsazení clusterů 1 / 0</text><rect x="36.0" y="508.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="50.0" y="536.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">.</text><text x="164.0" y="536.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">kořenový adresář</text><rect x="486.0" y="508.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="500.0" y="536.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$Boot</text><text x="614.0" y="536.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">boot sektor</text><rect x="36.0" y="560.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="50.0" y="588.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$BadClus</text><text x="164.0" y="588.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">seznam vadných clusterů</text><rect x="486.0" y="560.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="500.0" y="588.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$Quota</text><text x="614.0" y="588.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">kvóty uživatelů</text><rect x="36.0" y="612.0" width="438.0" height="44.0" rx="7" fill="#17211e" stroke="#2c3a35" stroke-width="1"/><text x="50.0" y="640.0" font-size="16" fill="#f1c873" font-weight="700" text-anchor="start" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace">$UpCase</text><text x="164.0" y="640.0" font-size="14.5" fill="#efebdd" font-weight="400" text-anchor="start">převod malých → velkých písmen</text><rect x="486.0" y="612.0" width="438.0" height="44.0" rx="7" fill="#0f1715" stroke="#61e38c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="705.0" y="640.0" font-size="14.5" fill="#61e38c" font-weight="600" text-anchor="middle">další záznamy: soubory a složky uživatele</text></svg>